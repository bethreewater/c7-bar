<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0A0A0A;
  --bg-card: #141414;
  --bg-card-hover: #1A1A1A;
  --line: #262626;
  --line-soft: #1F1F1F;
  --ink: #F5F5F0;
  --ink-mute: #888;
  --ink-faint: #555;
  --gold: #C9A961;
  --gold-soft: rgba(201, 169, 97, 0.18);
  --serif: "Playfair Display", "Noto Serif TC", "Songti TC", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

/* === HERO === */
.hero {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  position: relative;
  background: var(--bg);
}

.hero-logo-img {
  display: block;
  width: 100%;
  max-width: 460px;
  height: auto;
  margin-bottom: 48px;
  mix-blend-mode: screen;
}

.hero-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  margin-bottom: 56px;
}

/* 預設隱藏 fallback；圖檔載入失敗時 JS 用 inline style 蓋過 */
.hero-logo-fallback { display: none; }

.hero-logo .penghu {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--ink);
  font-weight: 400;
  padding-left: 0.4em;
}

.hero-logo .penghu .it {
  font-style: italic;
  letter-spacing: 0.3em;
}

.hero-logo h1 {
  font-family: var(--serif);
  font-size: clamp(28px, 7.5vw, 56px);
  font-weight: 400;
  letter-spacing: 0.16em;
  line-height: 1;
  color: var(--ink);
  padding-left: 0.16em;
  white-space: nowrap;
}

.hero-logo .tag {
  font-family: var(--serif);
  font-size: clamp(9px, 2.4vw, 11px);
  letter-spacing: 0.4em;
  color: var(--ink);
  padding-left: 0.4em;
  font-weight: 400;
}

.hero-zh {
  font-family: var(--sans);
  font-size: clamp(13px, 3.4vw, 16px);
  letter-spacing: 0.32em;
  color: var(--ink-mute);
  padding-left: 0.32em;
  margin-bottom: 56px;
  font-weight: 300;
}

.hero-zh .sep { color: var(--ink-faint); margin: 0 6px; }

.hero-meta {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  padding-left: 0.22em;
}

.hero-meta .hours {
  font-family: var(--serif);
  color: var(--ink);
  font-size: clamp(17px, 4.4vw, 22px);
  letter-spacing: 0.16em;
  padding-left: 0.16em;
  font-weight: 400;
  display: inline-block;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: default;
  user-select: none;
}

.hero-meta .hours:hover {
  transform: scale(1.04);
}

.hero-meta .hours .num {
  display: inline-block;
}

.hero-meta .hours .colon {
  display: inline-block;
  color: var(--gold);
  animation: hours-blink 2.4s ease-in-out infinite;
  margin: 0 1px;
}

@keyframes hours-blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.22; }
}

.hero-meta .hours .dash {
  display: inline-block;
  margin: 0 6px;
  background: linear-gradient(
    90deg,
    rgba(245,245,240,0.65) 0%,
    rgba(245,245,240,0.65) 30%,
    var(--gold) 45%,
    #F5E6B8 50%,
    var(--gold) 55%,
    rgba(245,245,240,0.65) 70%,
    rgba(245,245,240,0.65) 100%
  );
  background-size: 220% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: dash-flow 5s linear infinite;
}

@keyframes dash-flow {
  0%   { background-position: 200% 0; }
  100% { background-position: -100% 0; }
}

.hours-progress {
  position: relative;
  width: 100%;
  max-width: 220px;
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 6px 0 4px;
}

.hours-progress-dot {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  top: 50%;
  left: 0%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--gold), 0 0 18px rgba(201, 169, 97, 0.45);
  opacity: 0;
  transition: left 1.2s ease, opacity 0.6s;
}

.hours-progress.active .hours-progress-dot {
  opacity: 1;
  animation: dot-breathe 2.8s ease-in-out infinite;
}

@keyframes dot-breathe {
  0%, 100% { box-shadow: 0 0 8px var(--gold),  0 0 14px rgba(201,169,97,0.35); }
  50%      { box-shadow: 0 0 12px var(--gold), 0 0 24px rgba(201,169,97,0.65); }
}

.hero-meta .closed {
  font-size: 10px;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  color: var(--ink-mute);
}

/* === STATUS PILL === */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding: 7px 18px 7px 14px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  padding-left: calc(14px + 0.22em);
  transition: border-color 0.5s, color 0.5s;
  white-space: nowrap;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-faint);
  flex-shrink: 0;
  transition: background 0.5s;
}

.status-pill.open {
  border-color: rgba(123, 192, 142, 0.4);
  color: #C5DDC8;
}

.status-pill.open .status-dot {
  background: #7BC08E;
  box-shadow: 0 0 0 0 rgba(123, 192, 142, 0.7);
  animation: status-pulse 2.4s ease-out infinite;
}

.status-pill.soon {
  border-color: rgba(201, 169, 97, 0.4);
  color: var(--gold);
}

.status-pill.soon .status-dot {
  background: var(--gold);
  box-shadow: 0 0 0 0 rgba(201, 169, 97, 0.7);
  animation: status-pulse-soon 2s ease-out infinite;
}

.status-pill.closed {
  border-color: rgba(255,255,255,0.08);
  color: var(--ink-faint);
}

@keyframes status-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(123, 192, 142, 0.7); }
  60%  { box-shadow: 0 0 0 9px rgba(123, 192, 142, 0); }
  100% { box-shadow: 0 0 0 0   rgba(123, 192, 142, 0); }
}

@keyframes status-pulse-soon {
  0%   { box-shadow: 0 0 0 0   rgba(201, 169, 97, 0.7); }
  60%  { box-shadow: 0 0 0 8px rgba(201, 169, 97, 0); }
  100% { box-shadow: 0 0 0 0   rgba(201, 169, 97, 0); }
}

.scroll-hint {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.5em;
  color: var(--ink-faint);
  padding-left: 0.5em;
  animation: floatY 2.4s ease-in-out infinite;
}

@keyframes floatY {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.6; }
  50%      { transform: translateX(-50%) translateY(6px); opacity: 1; }
}

/* === LANGUAGE SWITCH === */
.lang-switch {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 60;
  display: flex;
  gap: 1px;
  background: rgba(12, 12, 12, 0.94);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border: 1px solid var(--gold-soft);
  border-radius: 999px;
  padding: 3px;
  box-shadow: -8px 0 16px rgba(10,10,10,0.6), 0 2px 10px rgba(0,0,0,0.4);
}

.lang-switch button {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
  background: none;
  border: none;
  cursor: pointer;
  padding: 5px 9px;
  border-radius: 999px;
  line-height: 1;
  transition: color 0.15s, background 0.15s;
}

.lang-switch button.active {
  color: var(--bg);
  background: var(--gold);
}

.lang-switch button:hover:not(.active) { color: var(--ink); }

/* === NAV === */
nav.menu-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--gold-soft);
  padding: 14px 16px;
  text-align: center;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

@media (max-width: 639px) {
  nav.menu-nav { text-align: left; padding-right: 64px; }
}

nav.menu-nav::-webkit-scrollbar { display: none; }

nav.menu-nav a {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.28em;
  padding: 4px 14px;
  margin: 0 2px;
  color: var(--ink-mute);
  transition: color 0.15s;
  padding-left: calc(14px + 0.28em);
  padding-right: 14px;
}

nav.menu-nav a:hover, nav.menu-nav a:focus { color: var(--gold); }

/* === SECTION === */
section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 72px 20px 16px;
}

section h2.section-title {
  font-family: var(--serif);
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.4em;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 6px;
  padding-left: 0.4em;
}

section h2.section-title .zh {
  font-family: var(--sans);
  display: block;
  font-size: 24px;
  letter-spacing: 0.32em;
  color: var(--ink-mute);
  font-weight: 300;
  margin-top: 10px;
  padding-left: 0.32em;
}

section .section-rule {
  width: 32px;
  height: 1px;
  background: var(--ink-mute);
  margin: 22px auto 44px;
  opacity: 0.4;
}

/* === COCKTAIL GRID === */
.cocktail-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media (min-width: 640px) {
  .cocktail-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

@media (min-width: 1024px) {
  .cocktail-grid { grid-template-columns: repeat(3, 1fr); }
}

article.cocktail {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
  display: flex;
  flex-direction: column;
}

article.cocktail:hover {
  border-color: #444;
  background: var(--bg-card-hover);
  transform: translateY(-1px);
}

article.cocktail.open {
  border-color: var(--gold);
  background: var(--bg-card);
}

article.cocktail .cocktail-img {
  margin: 0;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #050505;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  transition: filter 0.4s;
}

article.cocktail .cocktail-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}

article.cocktail:hover .cocktail-img img {
  transform: scale(1.04);
}

article.cocktail .cocktail-img.no-img {
  display: none;
}

article.cocktail > .head {
  padding: 22px 20px 18px;
  cursor: pointer;
  user-select: none;
}

article.cocktail h3 {
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.25;
  margin-bottom: 6px;
}

article.cocktail h3 .en {
  display: block;
  margin-top: 4px;
  color: var(--ink-mute);
  font-size: 10px;
  letter-spacing: 0.28em;
  font-weight: 400;
  text-transform: uppercase;
  padding-left: 0.28em;
}

article.cocktail.open h3 .en { color: var(--gold); }

article.cocktail .stat {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}

article.cocktail .stat .vol {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-mute);
  padding-left: 0.16em;
}

article.cocktail .stat .price {
  font-size: 16px;
  letter-spacing: 0.08em;
  color: var(--gold);
  font-weight: 300;
  padding-left: 0.08em;
}

article.cocktail .taste {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  padding-left: 0.1em;
}

article.cocktail .taste > div {
  display: flex;
  align-items: center;
  white-space: nowrap;
}

article.cocktail .taste .t-name {
  min-width: 68px;
  flex-shrink: 0;
}

article.cocktail .taste .rating {
  display: inline-flex;
  position: relative;
  letter-spacing: 0.05em;
  margin-left: 4px;
  font-family: inherit;
  line-height: 1;
}

article.cocktail .taste .rating-bg {
  color: #2A2A2A;
}

article.cocktail .taste .rating-fg {
  position: absolute;
  top: 0;
  left: 0;
  color: var(--gold);
  overflow: hidden;
  white-space: nowrap;
  letter-spacing: 0.05em;
}

article.cocktail .story {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

article.cocktail.open .story {
  max-height: 1400px;
}

article.cocktail .story-inner {
  padding: 0 20px 22px;
  border-top: 1px solid var(--line-soft);
  margin-top: 0;
  padding-top: 18px;
}

article.cocktail .story-inner p {
  font-size: 14px;
  line-height: 1.8;
  color: #C5C5BE;
  white-space: pre-line;
  letter-spacing: 0.02em;
}

article.cocktail .ingredients {
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid var(--line-soft);
}

article.cocktail .ingredients .ing-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.34em;
  color: var(--gold);
  margin-bottom: 7px;
  padding-left: 0.34em;
}

article.cocktail .ingredients .ing-list {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  line-height: 1.8;
}

article.cocktail .ingredients .ing-list b {
  color: var(--ink);
  font-weight: 400;
}

article.cocktail .ingredients .ing-en {
  display: block;
  margin-top: 5px;
  color: #565650;
  font-size: 10.5px;
  letter-spacing: 0.04em;
}

article.cocktail .ingredients .ing-item {
  white-space: nowrap;
}

article.cocktail .ingredients .ing-en b {
  color: #8A8A82;
}

article.cocktail .taste em {
  font-style: normal;
  font-size: 8px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin: 0 3px 0 1px;
}

article.cocktail .story-en {
  margin-top: 16px;
  padding-top: 15px;
  border-top: 1px solid var(--line-soft);

/* 手機：雞尾酒 2 欄精簡卡片，點開展開詳情並跨整行 */
@media (max-width: 639px) {

  article.cocktail .head { padding: 13px 13px 14px; }
  article.cocktail h3 { font-size: 16px; }
  article.cocktail h3 .en { font-size: 8px; letter-spacing: 0.18em; margin-top: 3px; }
  article.cocktail .stat { margin-top: 9px; padding-top: 9px; justify-content: flex-start; }
  article.cocktail .stat .vol { display: none; }
  article.cocktail .stat .price { font-size: 15px; white-space: nowrap; }
  article.cocktail.open .stat { justify-content: space-between; }
  article.cocktail.open .stat .vol { display: inline; font-size: 9.5px; letter-spacing: 0.08em; }
  article.cocktail .toggle-hint { padding: 10px 0 2px; }

.kombucha-card {

}

.kombucha-card .k-img {

.kombucha-card .k-img img {

.section-note {

  font-size: 11px;

  color: var(--ink-faint);
  margin-top: 20px;
  padding-left: 0.18em;
}

/* === VISIT === */
section.visit {
  padding-top: 96px;
  padding-bottom: 96px;
}

.visit-card {

}

.visit-card .row {

}

.visit-card .label {

}

.visit-card .value {

}

.visit-card .value.big {
  font-size: clamp(22px, 5.5vw, 28px);

  color: var(--gold);

}

.visit-card .value.sub {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  margin-top: 8px;
  padding-left: 0.22em;
}

.maps-link {
  display: inline-block;
  margin-top: 28px;
  padding: 12px 28px;
  border: 1px solid var(--gold);

  border-radius: 999px;
  font-size: 12px;

  font-weight: 400;

.maps-link:hover {

/* === ABOUT === */
.about {

  padding-bottom: 72px;
}

.about-card {

  padding: 40px 32px;
}

.about-row {
  padding: 22px 0;

}

.about-row:first-child { padding-top: 0; }
.about-row:last-child { padding-bottom: 0; border-bottom: none; }

.about-row .label {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.32em;
  color: var(--gold);

}

.about-row .company-name {
  font-family: var(--serif);
  font-size: clamp(20px, 4.4vw, 26px);

}

.about-row .about-text {
  font-family: var(--sans);

.about-row .about-text-en {

.about-row .about-list {

.about-row .about-list li {

.inline-link {

.inline-link:hover {

/* === FOOTER === */
footer.site {

}

footer.site .mark {
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 0.5em;
  color: var(--ink);
  margin-bottom: 10px;
  padding-left: 0.5em;
}

footer.site .brand-line {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--ink-mute);
  margin-bottom: 6px;
  padding-left: 0.24em;
}

footer.site .company-line {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--ink);
  margin-bottom: 6px;
  padding-left: 0.24em;
}

footer.site .address-line {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--ink-mute);

  padding-left: 0.16em;
}

footer.site .copy {
  font-size: 10px;
  letter-spacing: 0.18em;
  padding-left: 0.18em;
  color: var(--ink-faint);
}

footer.site .social {

  letter-spacing: 0.32em;

}

}

footer.site .social a:hover { color: var(--ink); }

footer.site .social .dot {
  color: var(--ink-faint);
  margin: 0 4px;
}

/* === ADD-TO-CART BUTTON === */
.add-btn {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--gold-soft);
  border-radius: 999px;
  padding: 7px 16px 7px calc(16px + 0.16em);

  white-space: nowrap;
}
.add-btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.add-btn:active { transform: scale(0.96); }

article.cocktail .add-btn { display: block; width: 100%; margin-top: 14px; text-align: center; }
.eats-add { display: block; margin: 14px 20px 18px; text-align: center; }
.add-btn-sm { padding: 6px 11px; font-size: 13px; letter-spacing: 0; line-height: 1; }
.simple-card .meta { display: flex; align-items: center; gap: 10px; }
.kombucha-card .k-add { width: 100%; margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: 0.16em; padding: 7px 16px; }

@media (max-width: 639px) {
  article.cocktail .add-btn { margin-top: 11px; font-size: 10.5px; padding: 6px 10px; letter-spacing: 0.1em; }
}

/* === CART FAB === */
.cart-fab {
  position: fixed;
  bottom: 20px;
  right: 16px;
  z-index: 55;
  display: none;
  align-items: center;
  gap: 9px;
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: 999px;
  padding: 12px 20px 12px 16px;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(0,0,0,0.5);
  font-family: var(--sans);
}
.cart-fab.show { display: inline-flex; }
.cart-fab svg { width: 19px; height: 19px; flex-shrink: 0; }
.cart-fab-count { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
.cart-fab-label { font-size: 11px; letter-spacing: 0.2em; padding-left: 0.2em; }
.cart-fab.bump { animation: cartbump 0.32s ease; }
@keyframes cartbump { 0%,100%{ transform: scale(1); } 40%{ transform: scale(1.12); } }

/* === CART OVERLAY === */
.cart-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(8, 8, 8, 0.86);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.cart-overlay.open { display: flex; opacity: 1; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .cart-overlay.open { align-items: center; } }

.cart-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 460px;
  max-height: 84vh;
  overflow-y: auto;
  padding: 26px 22px 24px;
}
@media (min-width: 640px) { .cart-panel { border-radius: 16px; } }

.cart-head { display: flex; justify-content: space-between; align-items: baseline; }
.cart-title { font-family: var(--serif); font-size: 22px; color: var(--ink); letter-spacing: 0.04em; }
.cart-close { background: none; border: none; color: var(--ink-mute); font-size: 11px; letter-spacing: 0.18em; padding-left: 0.18em; cursor: pointer; }
.cart-close:hover { color: var(--ink); }
.cart-cta {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.06em;
  text-align: center;
  line-height: 1.5;
  margin: 16px 0 8px;
  padding: 14px 16px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: rgba(201, 169, 97, 0.10);
}
.cart-note { font-size: 10.5px; color: var(--ink-faint); text-align: center; letter-spacing: 0.04em; line-height: 1.5; margin: 0 0 16px; }
.cart-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.cart-name { font-size: 15px; color: var(--ink); letter-spacing: 0.02em; }
.cart-qty { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.cart-qty button { width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--gold); font-size: 15px; cursor: pointer; line-height: 1; transition: border-color 0.15s; }
.cart-qty button:hover { border-color: var(--gold); }
.cart-qty .q { font-size: 14px; min-width: 16px; text-align: center; color: var(--ink); }
.cart-empty { text-align: center; color: var(--ink-faint); padding: 32px 0; letter-spacing: 0.1em; padding-left: 0.1em; }
.cart-foot { margin-top: 20px; text-align: center; }
.cart-clear { background: none; border: 1px solid var(--line); color: var(--ink-mute); border-radius: 999px; padding: 9px 24px; font-size: 11px; letter-spacing: 0.2em; padding-left: calc(24px + 0.2em); cursor: pointer; transition: color 0.15s, border-color 0.15s; }
.cart-clear:hover { color: var(--ink); border-color: #444; }

</style>
</head>
<body>

<!-- ============ LANGUAGE SWITCH ============ -->
<div class="lang-switch" id="lang-switch" role="group" aria-label="language"></div>

<!-- ============ CART (in-person order pad) ============ -->
<button type="button" class="cart-fab" id="cart-fab" onclick="openCart()" aria-label="list">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5h12l-1 11H7l-1-11z"/><path d="M9 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>
  <span class="cart-fab-count" id="cart-fab-count">0</span>
  <span class="cart-fab-label" id="cart-fab-label"></span>
</button>
<div class="cart-overlay" id="cart-overlay" onclick="if(event.target===this)closeCart()">
  <div class="cart-panel" role="dialog" aria-modal="true">
    <div class="cart-head">
      <span class="cart-title" id="cart-title"></span>
      <button type="button" class="cart-close" id="cart-close" onclick="closeCart()"></button>
    </div>
    <p class="cart-cta" id="cart-cta"></p>
    <p class="cart-note" id="cart-note"></p>

<section id="eats">
  <h2 class="section-title">EATS<span class="zh hide-when-empty" data-i18n="sec_eats"></span></h2>

  if (n.startsWith('zh')) return 'zh';
  if (n.startsWith('ja')) return 'ja';
  if (n.startsWith('ko')) return 'ko';
  return 'en';
}

      "Secret Recipe Braised Beef Rice":    { name:"秘藏牛肉飯", tag:"慢燉入味，秘藏濃香", note:"一碗，藏住時間熬出的風味。" }
    },
    cocktails: {
      "Bondi Beach": { name:"邦代海灘", ingredients:["蘭姆酒","水蜜桃利口酒","柑橘香甜酒","檸檬","蘇打"], story:"2017 年在澳洲邦代海灘認識一個義大利人 Frenco，原本以為很教父，但熱情又多話的 Frenco 請了我一杯性感海灘。可能以為我酒量不好，接著就像電影一樣——每個來自異鄉的人聚在一起，一定都會討論自己的家鄉。Frenco 也不意外。聽著他那義式英文，又面對那藍天碧海，真是個美好的一天。" },
      "Apollo": { name:"太陽神", ingredients:["龍舌蘭","澎湖仙人掌酒","紅酒","檸檬"], story:"使用澎湖當地仙人掌酒，搭配紅酒襯托果香香氣，結合龍舌蘭清新草本香。簡單不失層次，非常適合在夏天的海灘飲用。" },
      "Casino": { name:"CASINO", ingredients:["琴酒","葡萄柚香甜酒","君度橙酒","甜香艾酒","檸檬"], story:"第一口清新的風味，迎來中韻淡淡的草本香，接著一鼓作氣打出好牌——讓你到家還默默回味著這勝利尾韻。" },
      "Ode of the River Goddess": { name:"洛神賦", ingredients:["白酒","君度橙酒","洛神花"], story:"翩若驚鴻，她自洛水那端凌波而來，羅襪不曾沾塵。\n洛神花是羅裙的緋、是回眸時將融未融的那一點紅。\n恨只恨人神道殊——\n我便將這一眼，斟進杯裡；\n可望而不可即的，至少還可飲。" },
      "Sexual Transformation Sangria": { name:"性轉山格利亞", ingredients:["紅酒","白蘭地","香艾酒","柳橙","覆盆莓"], story:"傳統的 Sangria 躺在西班牙午後的庭院，輕盈、果香、好入口。\n我把白蘭地和香艾酒推進去，它就站起來了——\n同樣的紅酒、柳橙、莓果，換個骨架，就是另一個人。" },
      "Daydream": { name:"白日夢", ingredients:["白酒","香艾酒","葡夢香甜酒","櫻桃利口酒"], story:"午後三點，太陽斜斜地落在桌邊。\n沒在做什麼，也沒有想做什麼。\n葡萄與櫻桃的香氣繞過來，像一段沒打算結束的慢板，把人從這裡，輕輕推到夢的那邊。" },
      "Angry Charlie": { name:"生氣的查理", ingredients:["黑刺李琴酒","琴酒","杏仁香甜酒","檸檬","蘇打"], story:"查理今天又在氣了。\n大概是電梯太擠、咖啡太燙、或某個沒回的訊息。\n但他不知道的是——黑刺李會把火氣一點點化開，杏仁是哄人的，蘇打是讓他嘆出那口氣的。\n喝完，他大概會忘記在氣什麼。" },
      "Seaman Bishop": { name:"水手畢夏普", ingredients:["蘭姆酒","伏特加","琴酒","君度橙酒","梅酒","百香果"], story:"大海上沒有教堂，水手有水手的祈禱。\n蘭姆酒是甲板、琴酒是風、梅酒是岸上的記憶，百香果是熱帶夜裡那束突然出現的光。\n一杯下去你就懂——為什麼遠航的人總要對著星星說話。" },
      "Childhood Sweethearts": { name:"青梅竹馬", ingredients:["梅酒","白蘭地","君度橙酒","青蘋果"], story:"不是每個青梅竹馬最後都在一起。\n但那個夏天的午後、那條彎彎的小巷、那聲喊你名字的口吻，還是會被收進記憶最暖的角落。\n青蘋果是初遇的酸，梅酒是時間的甜，白蘭地是後來才懂的溫度。" },
      "Queen Bee": { name:"女王蜂", ingredients:["威士忌","巨峰葡萄香甜酒","君度橙酒","檸檬"], story:"不是每座山都需要被征服。\n有些山就站在那裡，自成風景。\n四玫瑰是她肩上的盔甲，巨峰葡萄是她裙擺的紫色，你只能仰望——\n然後喝下這口烈，記住自己曾經這樣抬頭過。" },
      "Plum Lychee Fizz": { name:"梅荔氣麝麝", ingredients:["梅酒","荔枝酒","麝香葡萄酒","檸檬","蘇打"], story:"梅子的酸、荔枝的甜、麝香葡萄的香，本來各走各的——蘇打一沖，全冒成了泡泡，在杯裡你追我跑。\n氣麝麝的，像三隻小鹿在舌尖上蹦。" }
    },

  en: {
    eats: {
      "Secret Recipe Braised Beef Noodles": { name:"Secret Recipe Braised Beef Noodles", tag:"Slow-Braised. Deeply Savory.", note:"Rich comfort in every bite." },

    cocktails: {
      "Bondi Beach": { name:"Bondi Beach", ingredients:["Rum","Peach Liqueur","Curaçao","Lemon","Soda"], story:"In 2017, on Bondi Beach in Australia, I met an Italian named Frenco. I first took him for a Godfather type — but the warm, talkative Frenco bought me a Sex on the Beach, probably guessing I couldn't hold my drink. Then, just like in a movie, everyone far from home ends up talking about where they came from. Frenco was no exception. Listening to his Italian-accented English, facing that blue sky and sea — it was a beautiful day." },
      "Apollo": { name:"Apollo", ingredients:["Tequila","Penghu Cactus Liqueur","Red Wine","Lemon"], story:"Made with Penghu's local cactus liqueur, red wine lifting the fruity aroma, and tequila's fresh herbal note. Simple yet layered — perfect for a summer evening by the sea." },
      "Casino": { name:"Casino", ingredients:["Gin","Grapefruit Liqueur","Cointreau","Sweet Vermouth","Lemon"], story:"A crisp first sip, then a faint herbal note at the midpalate, then it plays its winning hand in one sweep — leaving you quietly savoring that victory long after you're home." },
      "Ode of the River Goddess": { name:"Ode of the River Goddess", ingredients:["White Wine","Cointreau","Hibiscus"], story:"Light as a startled swan, she glides across the Luo River, her silk stockings never touching dust.\nThe hibiscus is the crimson of her trailing robe — the half-melted red of a backward glance.\nIf only gods and mortals did not walk separate ways —\nso I pour that single glance into a glass;\nwhat cannot be reached can at least be drunk." },
      "Sexual Transformation Sangria": { name:"Sexual Transformation Sangria", ingredients:["Red Wine","Brandy","Vermouth","Orange","Raspberry"], story:"Traditional Sangria reclines in a Spanish afternoon courtyard — light, fruity, easy.\nI pushed in brandy and vermouth, and it stood up —\nthe same red wine, orange, berries, but with a new spine, it became someone else entirely." },
      "Daydream": { name:"Daydream", ingredients:["White Wine","Vermouth","Pavan","Cherry Liqueur"], story:"Three in the afternoon, sunlight slanting onto the table's edge.\nDoing nothing, wanting nothing.\nThe scent of grape and cherry drifts over, like an adagio with no intention of ending,\ngently nudging you from here to the other side of a dream." },
      "Angry Charlie": { name:"Angry Charlie", ingredients:["Sloe Gin","Gin","Amaretto","Lemon","Soda"], story:"Charlie's angry again today.\nMaybe the elevator was too crowded, the coffee too hot, or some message left unanswered.\nBut what he doesn't know is —\nthe sloe gin dissolves his temper bit by bit, the amaretto coaxes him,\nthe soda lets him sigh it all out.\nBy the last sip, he'll probably forget what he was angry about." },
      "Seaman Bishop": { name:"Seaman Bishop", ingredients:["Rum","Vodka","Gin","Cointreau","Plum Wine","Passion Fruit"], story:"There are no churches at sea; sailors have their own prayers.\nRum is the deck, gin is the wind, plum wine is the memory of shore,\npassion fruit is that sudden beam of light in the tropical night.\nOne sip and you'll understand —\nwhy those who sail far always talk to the stars." },
      "Childhood Sweethearts": { name:"Childhood Sweethearts", ingredients:["Plum Wine","Brandy","Cointreau","Green Apple"], story:"Not every childhood sweetheart ends up together.\nBut that summer afternoon, that winding alley, the way your name was called —\nthey're still tucked into the warmest corner of memory.\nGreen apple is the tartness of first meeting, plum wine the sweetness of time,\nbrandy the warmth understood only later." },
      "Queen Bee": { name:"Queen Bee", ingredients:["Whiskey","Kyoho Grape Liqueur","Cointreau","Lemon"], story:"Not every mountain needs to be conquered.\nSome just stand there, a landscape unto themselves.\nFour Roses is the armor on her shoulders, Kyoho grape the purple of her gown,\nyou can only look up —\nthen drink down this fire, and remember you once held your head this high." },
      "Plum Lychee Fizz": { name:"Plum Lychee Fizz", ingredients:["Plum Wine","Lychee Liqueur","Muscat Wine","Lemon","Soda"], story:"Plum's tartness, lychee's sweetness, muscat's perfume — each off on its own, until the soda sweeps in and turns them all to bubbles, chasing one another around the glass.\nFizzy and frisky, like three little deer leaping on the tip of your tongue." }

  ja: {
    eats: {
      "Secret Recipe Braised Beef Noodles": { name:"秘伝の牛肉麺", tag:"じっくり煮込んだ、秘伝の深い香り", note:"ひと口ごとに、力強くやさしい満足を。" },
      "Secret Recipe Braised Beef Rice":    { name:"秘伝の牛肉飯", tag:"じっくり煮込んだ、秘伝の深い香り", note:"一杯に、時間が煮出した風味を閉じ込めて。" }
    },
    cocktails: {
      "Bondi Beach": { name:"ボンダイ・ビーチ", ingredients:["ラム","ピーチ・リキュール","キュラソー","レモン","ソーダ"], story:"2017年、オーストラリアのボンダイ・ビーチで、フレンコというイタリア人と出会った。最初はゴッドファーザーみたいな男かと思ったけれど、陽気でおしゃべりなフレンコは、わたしに一杯のセックス・オン・ザ・ビーチをおごってくれた。きっと酒に弱いと思われたのだろう。それからは、まるで映画のように――異国にいる者どうしが集まれば、必ず故郷の話になる。フレンコも例外ではなかった。イタリア訛りの英語に耳を傾けながら、あの青い空と海を眺める。本当に、素晴らしい一日だった。" },
      "Apollo": { name:"アポロ（太陽神）", ingredients:["テキーラ","澎湖サボテン酒","赤ワイン","レモン"], story:"澎湖の地サボテン酒を使い、赤ワインで果実の香りを引き立て、テキーラの爽やかなハーブの風味を重ねた一杯。シンプルでいて奥行きがあり、夏の海辺の夕べにぴったりです。" },
      "Casino": { name:"カジノ", ingredients:["ジン","グレープフルーツ・リキュール","コアントロー","スイート・ベルモット","レモン"], story:"ひと口めは爽やかに、中盤にはほのかなハーブの香り、そして一気に勝負の手を打つように――家に着いてもなお、その勝利の余韻をそっと味わってしまう。" },
      "Ode of the River Goddess": { name:"洛神賦", ingredients:["白ワイン","コアントロー","ハイビスカス（洛神花）"], story:"翩として驚鴻のごとく、彼女は洛水の彼方から波を踏んで現れる。絹の靴は、ついぞ塵に触れない。\nハイビスカスは羅裙の緋――振り返るその刹那、溶けきらぬひとひらの紅。\n恨むらくは、人と神の道の異なること――\nならばこの一瞥を、盃に注ごう。\n望めども届かぬものも、せめて飲むことはできるのだから。" },
      "Sexual Transformation Sangria": { name:"性転換サングリア", ingredients:["赤ワイン","ブランデー","ベルモット","オレンジ","ラズベリー"], story:"伝統のサングリアは、スペインの午後の中庭に横たわる――軽やかで、果実味豊かで、するりと飲める。\nそこへブランデーとベルモットを押し込むと、それはすっと立ち上がった――\n同じ赤ワイン、オレンジ、ベリー。骨格を変えれば、もう別の誰かだ。" },
      "Daydream": { name:"白昼夢", ingredients:["白ワイン","ベルモット","パヴァン","チェリー・リキュール"], story:"午後三時、陽が斜めにテーブルの端へ落ちる。\n何をするでもなく、何をしたいわけでもなく。\nぶどうとチェリーの香りがふわりと巡り、終わるあてのないアダージョのように、ここから夢の向こうへと、人をそっと押しやっていく。" },
      "Angry Charlie": { name:"怒れるチャーリー", ingredients:["スロー・ジン","ジン","アマレット","レモン","ソーダ"], story:"チャーリーは今日もまた怒っている。\nたぶん、エレベーターが混んでいたか、コーヒーが熱すぎたか、それとも返ってこないメッセージのせいか。\nでも彼は知らない――スロー・ジンがその苛立ちを少しずつ溶かし、アマレットがなだめ、ソーダがその溜息をそっと吐き出させてくれることを。\n飲み終えるころには、何に怒っていたのかも、きっと忘れているだろう。" },
      "Seaman Bishop": { name:"シーマン・ビショップ", ingredients:["ラム","ウォッカ","ジン","コアントロー","梅酒","パッションフルーツ"], story:"海の上に教会はない。船乗りには船乗りの祈りがある。\nラムは甲板、ジンは風、梅酒は岸辺の記憶、パッションフルーツは熱帯の夜にふと差す一筋の光。\nひと口で分かる――なぜ遠くへ航る者は、いつも星に語りかけるのかを。" },
      "Childhood Sweethearts": { name:"幼馴染", ingredients:["梅酒","ブランデー","コアントロー","青りんご"], story:"幼馴染が、みな最後に結ばれるわけではない。\nそれでも、あの夏の午後、あの曲がりくねった路地、名前を呼んだあの声音は、記憶のいちばん暖かな片隅に、今もそっとしまわれている。\n青りんごは出会いの酸っぱさ、梅酒は時の甘さ、ブランデーは後になってようやく分かる温もり。" },
      "Queen Bee": { name:"女王蜂", ingredients:["ウイスキー","巨峰リキュール","コアントロー","レモン"], story:"すべての山が、征服されねばならぬわけではない。\nただそこに立ち、それ自体がひとつの風景となる山もある。\nフォア・ローゼズは彼女の肩を守る鎧、巨峰は裾を彩る紫。あなたはただ仰ぎ見るほかない――\nそしてこの強い一杯を飲み干し、かつて自分もこうして顔を上げたことを、胸に刻むのだ。" },
      "Plum Lychee Fizz": { name:"梅と茘枝のマスカットフィズ", ingredients:["梅酒","茘枝リキュール","マスカットワイン","レモン","ソーダ"], story:"梅の酸味、茘枝の甘さ、マスカットの香り——それぞれ気ままだったのに、ソーダが弾けた途端、みんな泡になってグラスの中で追いかけっこ。\nしゅわしゅわと、三匹の子鹿が舌先で跳ねるみたいに。" }
    },

    cocktails: {
      "Bondi Beach": { name:"본다이 비치", ingredients:["럼","피치 리큐어","쿠라소","레몬","소다"], story:"2017년 호주 본다이 비치에서 프렌코라는 이탈리아 남자를 만났다. 처음엔 영락없는 마피아 두목인 줄 알았는데, 다정하고 말 많은 프렌코는 나에게 섹스 온 더 비치 한 잔을 사주었다. 아마 내 주량이 약하다고 본 모양이다. 그러고는 꼭 영화처럼——타향에서 온 사람들이 모이면 결국 저마다 고향 이야기를 꺼내기 마련이다. 프렌코도 예외는 아니었다. 그 이탈리아식 영어에 귀를 기울이며, 푸른 하늘과 바다를 마주한——참으로 근사한 하루였다." },
      "Apollo": { name:"아폴로 (태양신)", ingredients:["데킬라","펑후 선인장주","레드 와인","레몬"], story:"펑후 현지의 선인장주를 베이스로, 레드 와인이 과일향을 끌어올리고, 데킬라가 산뜻한 허브 노트를 더했습니다. 단순하면서도 층이 살아 있어, 여름날 바닷가에서 즐기기에 더없이 좋습니다." },
      "Casino": { name:"카지노", ingredients:["진","자몽 리큐어","쿠앵트로","스위트 베르무트","레몬"], story:"첫 모금의 산뜻함, 이어 중반에 은은히 번지는 허브 향, 그리고 단숨에 내미는 승부의 한 수——집에 도착해서도 그 승리의 여운을 가만히 곱씹게 됩니다." },

function stars(n, total = 5) {
  const pct = Math.max(0, Math.min(100, (n / total) * 100));
  return `<span class="rating"><span class="rating-bg">${'★'.repeat(total)}</span><span class="rating-fg" style="width:${pct}%">${'★'.repeat(total)}</span></span>`;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function enName(section, key){ const m = MENU.en[section] && MENU.en[section][key]; return (typeof m === 'string') ? m : (m && m.name) || key; }
// English sub-label under native name (skip on English view to avoid duplicate)
function enSub(section, key){ return lang === 'en' ? '' : `<span class="en">${enName(section,key)}</span>`; }

function applyI18n(){

  document.title = t('doc_title');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.getAttribute('data-i18n'));

  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = t(el.getAttribute('data-i18n-html'));
  });
  const ul = document.getElementById('about-list');
  if (ul) { const items = t('about_services_list') || []; ul.innerHTML = items.map(x => `<li>${x}</li>`).join(''); }
}

function buildSwitch(){
  const labels = { zh:'中', en:'EN', ja:'日', ko:'한' };
  const el = document.getElementById('lang-switch');
  if (!el) return;
  el.innerHTML = SUPPORTED.map(l => `<button type="button" data-lang="${l}" aria-label="${l}">${labels[l]}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
}
function updateSwitch(){
  document.querySelectorAll('#lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}
function setLang(l){
  if (!SUPPORTED.includes(l)) return;
  lang = l;
  try { localStorage.setItem('c7lang', l); } catch(e){}
  try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
  applyI18n(); renderAll(); updateSwitch(); updateCart();
  if (window.__c7updateStatus) window.__c7updateStatus();
}

// ============ LIVE STATUS ============
// 營業時段：每日 18:07 — 翌日 00:07 ｜ 週一(1)、週四(4) 公休
// 注意：00:00–00:07 屬於「前一天」的延伸營業（看前一天是否公休）
(function liveStatus() {
  const OPEN_START = 18 * 60 + 7;  // 1087 (18:07)
  const OPEN_END   = 7;             // 7    (00:07 of next day)
  const CLOSED_DAYS = new Set([1, 4]);

  function fmtDuration(mins) {
    if (mins < 60) return `${mins}m`;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h < 24) return m > 0 ? `${h}h ${m}m` : `${h}h`;
    const d = Math.floor(h / 24);
    const rh = h % 24;
    return rh > 0 ? `${d}d ${rh}h` : `${d}d`;
  }

  function getStatus(now = new Date()) {
    const day = now.getDay();
    const totalMin = now.getHours() * 60 + now.getMinutes();

    // Case A: 凌晨 00:00–00:07，前一天的延伸營業
    if (totalMin < OPEN_END) {
      const yesterday = (day + 6) % 7;
      if (!CLOSED_DAYS.has(yesterday)) {
        const minsLeft = OPEN_END - totalMin;
        return {
          state: minsLeft <= 30 ? 'soon' : 'open',
          key: 'status_open', dur: fmtDuration(minsLeft)
        };
      }
    }
    // Case B: 晚上 18:07 之後，今天是否營業
    else if (totalMin >= OPEN_START) {
      if (!CLOSED_DAYS.has(day)) {
        const minsLeft = (24 * 60 + OPEN_END) - totalMin;
        return {
          state: minsLeft <= 30 ? 'soon' : 'open',
          key: 'status_open', dur: fmtDuration(minsLeft)
        };
      }
    }

    // Case C: 打烊中，找下個營業日的 18:07
    for (let i = 0; i < 8; i++) {
      const checkDay = (day + i) % 7;
      if (CLOSED_DAYS.has(checkDay)) continue;
      let minsTo;
      if (i === 0) {
        if (totalMin >= OPEN_START) continue;  // 已過今晚開門時間（不該到這 case，但保險）
        minsTo = OPEN_START - totalMin;
      } else {
        minsTo = i * 24 * 60 + OPEN_START - totalMin;
      }
      return {
        state: minsTo <= 60 ? 'soon' : 'closed',
        key: 'status_closed_opens', dur: fmtDuration(minsTo)
      };
    }
    return { state: 'closed', key: 'status_closed', dur: '' };
  }

  function update() {
    const pill = document.getElementById('status-pill');
    const label = document.getElementById('status-label');
    if (!pill || !label) return;
    const { state, key, dur } = getStatus();
    pill.classList.remove('open', 'soon', 'closed');
    pill.classList.add(state);
    label.textContent = t(key).replace('{t}', dur || '');
    updateProgressDot();
  }
  window.__c7updateStatus = update;

  function updateProgressDot() {
    const wrapper = document.getElementById('hours-progress');
    const dot = document.getElementById('hours-progress-dot');
    if (!wrapper || !dot) return;

    const now = new Date();
    const day = now.getDay();
    const totalMin = now.getHours() * 60 + now.getMinutes();
    const SESSION_LEN = (24 * 60 - OPEN_START) + OPEN_END;  // 360 min

    let inSession = false;
    let pct = 0;

    if (totalMin < OPEN_END) {
      const yesterday = (day + 6) % 7;
      if (!CLOSED_DAYS.has(yesterday)) {
        inSession = true;
        pct = ((24 * 60 - OPEN_START + totalMin) / SESSION_LEN) * 100;
      }
    } else if (totalMin >= OPEN_START) {
      if (!CLOSED_DAYS.has(day)) {
        inSession = true;
        pct = ((totalMin - OPEN_START) / SESSION_LEN) * 100;
      }
    }

    if (inSession) {
      wrapper.classList.add('active');
      dot.style.left = `${Math.min(100, Math.max(0, pct))}%`;
    } else {
      wrapper.classList.remove('active');
    }
  }

  update();
  setInterval(update, 60_000);
})();

// ============ CART (in-person order pad, no checkout) ============
const CART_I18N = {
  zh: { add:"加入", fab:"清單", title:"我的清單", empty:"清單還是空的", cta:"請現場向店員點單", note:"此清單僅供參考，不是線上結帳", clear:"清空", close:"關閉" },
  en: { add:"Add", fab:"List", title:"My List", empty:"Your list is empty", cta:"Please order in person with our staff", note:"A reference list only — not online checkout", clear:"Clear", close:"Close" },
  ja: { add:"追加", fab:"リスト", title:"マイリスト", empty:"リストは空です", cta:"店内でスタッフにご注文ください", note:"これは参考用リストで、オンライン注文ではありません", clear:"クリア", close:"閉じる" },
  ko: { add:"담기", fab:"리스트", title:"내 리스트", empty:"리스트가 비어 있습니다", cta:"매장에서 직원에게 주문해 주세요", note:"참고용 리스트이며 온라인 결제가 아닙니다", clear:"비우기", close:"닫기" }
};
function ct(key){ for (const l of [lang,'en','zh']) { const v = CART_I18N[l] && CART_I18N[l][key]; if (v != null) return v; } return ''; }

let cart = (function(){ try { return JSON.parse(localStorage.getItem('c7cart') || '{}') || {}; } catch(e){ return {}; } })();
function saveCart(){ try { localStorage.setItem('c7cart', JSON.stringify(cart)); } catch(e){} }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartItemName(sec, key){ const tr = trItem(sec, key); if (tr == null) return key; return typeof tr === 'string' ? tr : (tr.name || key); }
function addToCart(sec, key){ const k = sec + '|' + key; cart[k] = (cart[k]||0) + 1; saveCart(); updateCart(); bumpFab(); }
function setQty(k, q){ if (q <= 0) delete cart[k]; else cart[k] = q; saveCart(); updateCart(); }
function clearCart(){ cart = {}; saveCart(); updateCart(); }

function bumpFab(){ const f = document.getElementById('cart-fab'); if(!f) return; f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
function setText(id, v){ const e = document.getElementById(id); if (e) e.textContent = v; }

function renderCartList(){
  const wrap = document.getElementById('cart-list');
  if (!wrap) return;
  const entries = Object.entries(cart);
  if (!entries.length) { wrap.innerHTML = `<p class="cart-empty">${ct('empty')}</p>`; return; }
  wrap.innerHTML = entries.map(([k, q]) => {
    const i = k.indexOf('|');
    const sec = k.slice(0, i), key = k.slice(i + 1);
    return `<div class="cart-row">
      <span class="cart-name">${cartItemName(sec, key)}</span>
      <span class="cart-qty">
        <button type="button" onclick="setQty('${k.replace(/'/g,"\\'")}',${q-1})" aria-label="−">−</button>
        <span class="q">${q}</span>
        <button type="button" onclick="setQty('${k.replace(/'/g,"\\'")}',${q+1})" aria-label="+">＋</button>
      </span>
    </div>`;
  }).join('');
}
function refreshCartLabels(){ setText('cart-title', ct('title')); setText('cart-cta', ct('cta')); setText('cart-note', ct('note')); setText('cart-clear', ct('clear')); setText('cart-close', ct('close')); }
function updateCart(){
  const n = cartCount();
  setText('cart-fab-count', n);
  setText('cart-fab-label', ct('fab'));
  const fab = document.getElementById('cart-fab');
  if (fab) fab.classList.toggle('show', n > 0);
  if (document.getElementById('cart-overlay') && document.getElementById('cart-overlay').classList.contains('open')) { refreshCartLabels(); renderCartList(); }
}
function openCart(){ const o = document.getElementById('cart-overlay'); if(!o) return; o.classList.add('open'); document.body.style.overflow = 'hidden'; refreshCartLabels(); renderCartList(); }
function closeCart(){ const o = document.getElementById('cart-overlay'); if(!o) return; o.classList.remove('open'); document.body.style.overflow = ''; }

applyI18n();
renderAll();
updateSwitch();
updateCart();

// ============ INTERACTION ============
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('article.cocktail.open').forEach(c => {
    if (c !== card) c.classList.remove('open');
  });
  card.classList.toggle('open', !wasOpen);
}
